title: Microchip SDHC controller

description: |
  Microchip SDHC controller driver.

  Microchip G1 SDHC controller driver supports the following hardware peripheral:
    - module name="SDHC" compatible="microchip,sdhc-g1"

  The node must specify the register region, the controller interrupt, the
  main, generic and slow generic clock sources (named "mclk", "gclk" and
  "gclk-slow"), and a pinctrl configuration for the SD bus pads.

compatible: "microchip,sdhc-g1"

include:
  - name: sdhc.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true
    description: |
      Base address and size of the SDHC controller register region.

  clocks:
    required: true
    description: |
      Clock sources driving the SDHC controller.

  clock-names:
    required: true
    description: |
      Names of the clock sources listed in "clocks", in the same order.
      Must be "mclk" (main clock), "gclk" (generic clock) and "gclk-slow"
      (slow generic clock).

  interrupts:
    required: true
    description: |
      SDHC controller interrupt line.

  max-bus-freq:
    type: int
    default: 400000
    description: |
      Maximum bus frequency for SD card. This should be the highest frequency
      the SDHC is capable of negotiating with cards on the bus.

  min-bus-freq:
    type: int
    default: 400000
    description: |
      Minimum bus frequency for SD card. This should be the frequency that
      cards first will select when attached to the SDHC bus

  power-delay-ms:
    type: int
    default: 500
    description: |
      time in ms for SDHC to delay when toggling power to the SD card. This
      delay gives the card time to power up or down fully

  pinctrl-0:
    required: true
    description: |
      Pin configuration for the SD bus pads in the default state.

  pinctrl-names:
    required: true
    description: |
      Names of the pinctrl states defined for this controller. Must include
      "default" matching pinctrl-0.

examples:
  - |
    #Example devicetree configuration for Microchip G1 SDHC controller:

    sdhc0: sdhc@46000000 {
            compatible = "microchip,sdhc-g1";
            reg = <0x46000000 0x234>;
            interrupts = <136 0>;
            clocks = <&mclkperiph CLOCK_MCHP_MCLKPERIPH_ID_AHB_SDHC1>,
                     <&gclkperiph CLOCK_MCHP_GCLKPERIPH_ID_SDHC1>,
                     <&gclkperiph CLOCK_MCHP_GCLKPERIPH_ID_SDHC1_SLOW>;
            clock-names = "mclk", "gclk", "gclk-slow";
            min-bus-freq = <400000>;
            max-bus-freq = <25000000>;
            pinctrl-0 = <&sdhc0_default>;
            pinctrl-names = "default";
            status = "okay";
    };
