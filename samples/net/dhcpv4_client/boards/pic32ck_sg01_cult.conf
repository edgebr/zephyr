CONFIG_NET_L2_ETHERNET=y
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_PHY_AUTONEG_TIMEOUT_MS=10000
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_ETH_MCHP_BUF_RX_COUNT=16
CONFIG_ETH_MCHP_RX_THREAD_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_LOG_PRINTK=n

# Place GMAC DMA descriptors (__nocache attribute) in non-cacheable region
CONFIG_NOCACHE_MEMORY=y